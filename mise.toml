[tools]
go = "1.26"

[tasks.build]
description = "Build the CSVtoSheets command-line application"
run = "go build -o bin/CSVtoSheets ./cmd/csv-to-sheets"

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.app]
description = "Build a macOS application bundle"
depends = ["build"]
run = "scripts/build-app.sh"

[tasks.test-app]
description = "Test the bundled Go application with the included test CSV"
depends = ["app"]
run = "\"$PWD/dist/CSVtoSheets.app/Contents/MacOS/CSVtoSheets-core\" \"$PWD/testdata/umsatz-test.csv\""

[tasks.install-app]
description = "Replace the installed CSVtoSheets application in /Applications"
depends = ["app"]
run = "rm -rf /Applications/CSVtoSheets.app && cp -R \"$PWD/dist/CSVtoSheets.app\" /Applications/"
